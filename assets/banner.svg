<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>

  <!-- Animated Dynamic Background Elements (Pills & Waves) -->
  <g opacity="0.25">
    <circle cx="150" cy="80" r="120" fill="#6366f1">
      <animate attributeName="cy" values="80;100;80" dur="8s" repeatCount="indefinite" />
      <animate attributeName="r" values="120;135;120" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="240" r="140" fill="#ec4899">
      <animate attributeName="cy" values="240;210;240" dur="10s" repeatCount="indefinite" />
      <animate attributeName="r" values="140;160;140" dur="10s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Dynamic Animated Graph & Nodes in Background -->
  <g opacity="0.2" stroke="url(#glowGrad)" stroke-width="2" fill="none">
    <path d="M 50,260 Q 200,120 400,220 T 750,140 T 1150,250">
      <animate attributeName="d" values="M 50,260 Q 200,120 400,220 T 750,140 T 1150,250; M 50,240 Q 200,160 400,180 T 750,180 T 1150,230; M 50,260 Q 200,120 400,220 T 750,140 T 1150,250" dur="12s" repeatCount="indefinite" />
    </path>
    <circle cx="400" cy="220" r="6" fill="#38bdf8" />
    <circle cx="750" cy="140" r="6" fill="#a855f7" />
  </g>

  <!-- Floating Dynamic Tech Pills (Background decoration) -->
  <g opacity="0.35">
    <rect x="80" y="210" width="130" height="32" rx="16" fill="#1e293b" stroke="#475569">
      <animate attributeName="y" values="210;200;210" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="145" y="231" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">📚 Ebooks</text>

    <rect x="980" y="70" width="140" height="32" rx="16" fill="#1e293b" stroke="#475569">
      <animate attributeName="y" values="70;82;70" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="1050" y="91" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">⚡ Open-Source</text>
  </g>

  <!-- Accent Top Border Line -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#glowGrad)"/>

  <!-- Foreground Title and Subtitle Layer (Guaranteed Front Visibility) -->
  <g text-anchor="middle" filter="url(#shadow)">
    <!-- Main Icon Header -->
    <text x="600" y="95" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="42" fill="#ffffff">
      📖 Awesome Digital Library Platform
    </text>
    
    <!-- Gradient Main Subtitle -->
    <text x="600" y="155" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" fill="url(#textGrad)">
      Curated Ecosystem for Ebook Lending, LSP &amp; Digital Collections
    </text>

    <!-- Description Chips / Text -->
    <text x="600" y="215" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="16" fill="#cbd5e1">
      🏛️ Academic &amp; Public Libraries  •  🚀 SaaS &amp; Open-Source  •  📊 Market Insights
    </text>
  </g>
</svg>
